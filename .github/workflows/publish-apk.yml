name: Publish Packing Station APK

on:
  workflow_run:
    workflows: ["Build Android Printer Test APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download new packing station APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name jtk-rp425-test-apk --dir /tmp/apk
          test -s /tmp/apk/app-debug.apk
          cp /tmp/apk/app-debug.apk /tmp/JTK-Packing-Station-v2.apk
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create packing-station-v2 /tmp/JTK-Packing-Station-v2.apk \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "JTK Packing Station v2 - neutral labels" \
            --notes "Android packing application with neutral 4x6 package labels. New IDs start PKG- instead of JTK-. Existing Google Sheet records remain unchanged. Backup data is in Google Sheets, not stored locally; you may need to uninstall the previous APK because Android debug build signatures can differ." \
            --latest
