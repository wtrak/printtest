name: Publish RP425 test APK

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40049191430 --repo "$GITHUB_REPOSITORY" \
            --name jtk-rp425-test-apk --dir /tmp/apk
          ls -lh /tmp/apk/app-debug.apk
      - name: Publish APK as direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/apk/app-debug.apk /tmp/JTK-Packing-Station-v1.apk
          gh release create packing-station-v1 /tmp/JTK-Packing-Station-v1.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JTK Packing Station v1" \
            --notes "Packing Station Android APK: private on-device customer CSV, packing entries, Bluetooth 4x6 labels with QR code. Uninstall the previous test APK before installing. Back up tablet data regularly." \
            --latest
